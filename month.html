<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타코베베 공구 달력</title>
<meta property="og:title" content="타코베베 공구 달력">
<meta property="og:description" content="진행 중인 공구와 오픈 예정 공구를 달력으로 한눈에">
<meta name="description" content="타코베베 공동구매 일정을 달력으로 한눈에 — 진행 중 · 오픈 예정 공구">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗓️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
  /* 손님용 공구 달력 (2026-09-22). 인스타 프로필용 링크 페이지(index.html)와 따로 둔다.
     내부용 운영 캘린더는 calendar.html(/api/mycal) — 이것과 헷갈리지 말 것.
     링크 페이지(index.html)와 같은 톤: 흰 바탕 · 얇은 글씨 · 작은 모서리.
     진행 중 = 시그니처 연한 올리브, 오픈 예정 = 연한 하늘색, 지난 날 = 흐린 회색 */
  :root {
    --bg: #FFFFFF;
    --ink: #161616;
    --muted: #767370;
    --faint: #B8B4AA;
    --line: #EFEDE8;
    --img: #F1EFEA;
    --beige: #F7F5EE;
    --live: #D1D798;
    --live-ink: #2E3517;
    --soon: #DFE8EE;
    --soon-ink: #3D5A6E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 13px;
    line-height: 1.35;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .wrap { max-width: 460px; margin: 0 auto; padding-bottom: 40px; }

  header {
    position: sticky; top: 0; z-index: 5;
    display: grid; grid-template-columns: 44px 1fr 44px; align-items: center;
    height: 52px; padding: 0 6px;
    background: rgba(255, 255, 255, .96);
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; text-align: center; font-size: 16px; font-weight: 500; letter-spacing: -.03em; }
  header .back { display: grid; place-items: center; width: 44px; height: 44px; }
  header svg { width: 22px; height: 22px; }

  .month { display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 4px; }
  .month h2 { margin: 0; font-size: 21px; font-weight: 500; letter-spacing: -.03em; }
  .month .nav { display: flex; gap: 6px; }
  .month .nav button { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 50%; }
  .month .nav button:disabled { opacity: .3; cursor: default; }
  .month .nav svg { width: 16px; height: 16px; }

  .legend { display: flex; gap: 14px; padding: 6px 16px 14px; font-size: 11.5px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 3px; vertical-align: -1px; }

  .dow, .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 0 6px; }
  .dow { padding-bottom: 6px; font-size: 11px; color: var(--muted); text-align: center; }
  .week { grid-auto-rows: min-content; min-height: 76px; padding-bottom: 4px; border-top: 1px solid var(--line); }
  .week.quiet { min-height: 44px; }   /* 공구가 없는 주(지난 주 포함)는 낮게 */
  .day { grid-row: 1; padding: 5px 0 3px; text-align: center; font-size: 12.5px; }
  .day .n { display: inline-grid; place-items: center; width: 25px; height: 25px; border-radius: 50%; }
  .day.past .n, .day.out .n { color: var(--faint); }
  .day.today .n { background: var(--ink); color: #fff; font-weight: 500; }
  .day.sel:not(.today) .n { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .bar {
    display: block; min-width: 0; height: 19px; margin: 0 2px 3px; padding: 0 6px;
    border-radius: 4px; font-size: 10.5px; line-height: 19px; font-weight: 400;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left;
  }
  .bar.live { background: var(--live); color: var(--live-ink); }
  .bar.soon { background: var(--soon); color: var(--soon-ink); }
  .bar.l { margin-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .bar.r { margin-right: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; }

  .sec { margin-top: 10px; padding: 20px 16px 0; border-top: 8px solid var(--beige); }
  .sec + .sec { margin-top: 0; border-top-width: 1px; border-top-color: var(--line); }
  .sec h3 { margin: 0 0 4px; font-size: 16px; font-weight: 500; letter-spacing: -.03em; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .ph { flex: 0 0 64px; width: 64px; height: 64px; border-radius: 6px; overflow: hidden; background: var(--img); }
  .item .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .item .tx { flex: 1; min-width: 0; }
  .item .t { font-size: 13.5px; font-weight: 400; line-height: 1.35; }
  .item .p { margin-top: 3px; font-size: 11.5px; color: var(--muted); }
  .chip { display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 500; }
  .chip.live { background: var(--live); color: var(--live-ink); }
  .chip.soon { background: var(--soon); color: var(--soon-ink); }
  .item .go { flex: none; color: var(--muted); }
  .item .go svg { width: 18px; height: 18px; display: block; }
  .empty { padding: 12px 0 6px; font-size: 12.5px; color: var(--muted); }
  .note { padding: 18px 16px 0; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .shop { display: block; margin: 18px 16px 0; padding: 13px 0; border-radius: 4px; background: var(--live); color: var(--live-ink); text-align: center; font-size: 13px; font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="https://m.takkobebe.com/" aria-label="쇼핑몰로 돌아가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1>공구 달력</h1>
    <span></span>
  </header>

  <div class="month">
    <h2 id="mTitle"></h2>
    <div class="nav">
      <button id="prev" aria-label="이전 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <button id="next" aria-label="다음 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </div>
  <div class="legend"><span><i style="background:var(--live)"></i>진행 중</span><span><i style="background:var(--soon)"></i>오픈 예정</span></div>
  <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
  <div id="grid"></div>

  <div class="sec" id="daySec"></div>
  <div class="sec" id="nextSec"></div>

  <p class="note">날짜를 누르면 그날 진행하는 공구가 아래에 나와요. 공구는 시작일 오전 10시에 열리고, 마감일 자정에 닫힙니다.</p>
  <a class="shop" href="https://m.takkobebe.com/">타코베베 쇼핑몰 가기</a>
</div>

<script>
(function () {
  var API = '/api/schedule?o=cal';   // 달력 전용 캐시 키 (메인 ?o=m · PC ?o=pc 와 나눈다)
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  var CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';

  // 한국 시간 기준 오늘
  var kst = new Date(Date.now() + 9 * 3600e3);
  var TODAY = kst.toISOString().slice(0, 10);
  var HOUR = kst.getUTCHours();

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ymd(y, m, d) { return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0'); }
  function parse(s) { var p = s.slice(0, 10).split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
  function fmt(d) { return d.toISOString().slice(0, 10); }
  function addDays(s, n) { var d = parse(s); d.setUTCDate(d.getUTCDate() + n); return fmt(d); }
  function md(s) { var d = parse(s); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + '(' + DOW[d.getUTCDay()] + ')'; }
  function diff(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); }

  // 진행 중 / 오픈 예정 / 끝남 — 시작일 당일은 오전 10시부터 진행 중
  function status(ev) {
    var s = ev.start.slice(0, 10), e = ev.end.slice(0, 10);
    if (e < TODAY) return 'end';
    if (s > TODAY || (s === TODAY && HOUR < 11)) return 'soon';
    return 'live';
  }
  function chip(ev) {
    var st = status(ev), e = ev.end.slice(0, 10), s = ev.start.slice(0, 10);
    if (st === 'live') { var n = diff(TODAY, e); return '<span class="chip live">진행 중 · ' + (n === 0 ? '오늘 마감' : 'D-' + n) + '</span>'; }
    if (st === 'soon') return '<span class="chip soon">' + (s === TODAY ? '오늘' : md(s)) + ' 오전 10시 오픈</span>';
    return '';
  }

  var EVENTS = [], VIEW = null, SEL = TODAY, MIN = null, MAX = null;

  function monthOf(s) { return s.slice(0, 7); }
  function shiftMonth(ym, n) { var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + String(m + 1).padStart(2, '0'); }

  function drawGrid() {
    var y = +VIEW.slice(0, 4), m = +VIEW.slice(5, 7);
    document.getElementById('mTitle').textContent = y + '년 ' + m + '월';
    document.getElementById('prev').disabled = VIEW <= MIN;
    document.getElementById('next').disabled = VIEW >= MAX;
    var first = ymd(y, m, 1);
    var start = addDays(first, -parse(first).getUTCDay());
    var last = fmt(new Date(Date.UTC(y, m, 0)));
    var html = '';
    for (var w = start; w <= last; w = addDays(w, 7)) {
      var wEnd = addDays(w, 6), cells = '';
      for (var i = 0; i < 7; i++) {
        var d = addDays(w, i), cls = 'day';
        if (monthOf(d) !== VIEW) cls += ' out';
        if (d < TODAY) cls += ' past';
        if (d === TODAY) cls += ' today';
        if (d === SEL) cls += ' sel';
        cells += '<button class="' + cls + '" data-d="' + d + '" style="grid-column:' + (i + 1) + '"><span class="n">' + parse(d).getUTCDate() + '</span></button>';
      }
      // 이 주에 걸친 공구 막대 — 줄(lane)은 빈 자리에 차례로
      var lanes = [], bars = '';
      EVENTS.forEach(function (ev) {
        var s = ev.start.slice(0, 10), e = ev.end.slice(0, 10), st = status(ev);
        if (st === 'end' || e < w || s > wEnd) return;
        var a = s < w ? w : s, b = e > wEnd ? wEnd : e;
        var c0 = diff(w, a), c1 = diff(w, b);
        var lane = 0;
        while ((lanes[lane] || []).some(function (r) { return !(c1 < r[0] || c0 > r[1]); })) lane++;
        (lanes[lane] = lanes[lane] || []).push([c0, c1]);
        var cls = 'bar ' + st + (s < w ? ' l' : '') + (e > wEnd ? ' r' : '');
        bars += '<button class="' + cls + '" data-d="' + (a < TODAY && TODAY <= b ? TODAY : a) + '" style="grid-column:' + (c0 + 1) + ' / ' + (c1 + 2) + ';grid-row:' + (lane + 2) + '">' + esc(ev.title) + '</button>';
      });
      html += '<div class="week' + (bars ? '' : ' quiet') + '">' + cells + bars + '</div>';
    }
    document.getElementById('grid').innerHTML = html;
  }

  function item(ev) {
    var img = ev.img ? '<img src="' + esc(ev.img) + '" alt="" loading="lazy">' : '';
    var tag = ev.url ? 'a' : 'div', href = ev.url ? ' href="' + esc(ev.url) + '"' : '';
    return '<' + tag + ' class="item"' + href + '><span class="ph">' + img + '</span><span class="tx"><div class="t">' + esc(ev.title) + '</div>'
      + '<div class="p">' + md(ev.start) + ' – ' + md(ev.end) + '</div>' + chip(ev) + '</span>' + (ev.url ? '<span class="go">' + CHEV + '</span>' : '') + '</' + tag + '>';
  }

  function drawLists() {
    var on = EVENTS.filter(function (ev) { return status(ev) !== 'end' && ev.start.slice(0, 10) <= SEL && SEL <= ev.end.slice(0, 10); });
    var d = parse(SEL);
    var title = (SEL === TODAY ? '오늘 ' : '') + (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일 (' + DOW[d.getUTCDay()] + ') 공구';
    document.getElementById('daySec').innerHTML = '<h3>' + title + '</h3>' + (on.length ? on.map(item).join('') : '<p class="empty">이 날은 진행하는 공구가 없어요.</p>');
    var next = EVENTS.filter(function (ev) { return ev.start.slice(0, 10) > SEL && status(ev) !== 'end'; }).slice(0, 4);
    document.getElementById('nextSec').innerHTML = next.length ? '<h3>이어서 열리는 공구</h3>' + next.map(item).join('') : '';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-d]');
    if (t) { SEL = t.getAttribute('data-d'); drawGrid(); drawLists(); document.getElementById('daySec').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (e.target.closest('#prev') && VIEW > MIN) { VIEW = shiftMonth(VIEW, -1); drawGrid(); }
    if (e.target.closest('#next') && VIEW < MAX) { VIEW = shiftMonth(VIEW, 1); drawGrid(); }
  });

  function start(list) {
    EVENTS = (list || []).filter(function (ev) { return ev && ev.start && ev.end && ev.title; });
    MIN = monthOf(TODAY);
    MAX = EVENTS.reduce(function (m, ev) { var x = monthOf(ev.end); return x > m ? x : m; }, MIN);
    VIEW = MIN;
    drawGrid(); drawLists();
  }
  // 일정이 오기 전에도 달력 틀은 먼저 그린다
  start([]);
  document.getElementById('daySec').innerHTML = '<p class="empty">공구 일정을 불러오고 있어요…</p>';
  fetch(API).then(function (r) { return r.json(); }).then(function (d) { start(d.events); })
    .catch(function () { start([]); document.getElementById('daySec').innerHTML = '<p class="empty">일정을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</p>'; });
})();
</script>
</body>
</html>
