<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>takkobebe 공동구매 일정</title>
<meta property="og:title" content="takkobebe 공동구매 일정">
<meta property="og:description" content="두 아이를 키우는 40대 엄마의 이유있는 선택">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap">
<style>
  /* 흰 바탕 · 얇은 글씨 · 작은 모서리. 구매하기와 쇼핑몰 버튼만 시그니처 연한 올리브 */
  :root {
    --bg: #FFFFFF;
    --ink: #161616;       /* 기본 글자 */
    --sub: #3A3A37;       /* 예정 상품명 */
    --muted: #767370;     /* 날짜 · 안내 (흰 바탕 대비 4.5:1 이상) */
    --faint: #A9A59B;     /* 정가 취소선 */
    --line: #EFEDE8;      /* 목록 사이 가는 선 */
    --box: #E3E0D8;       /* 지금 구매 박스 테두리 */
    --btn-line: #DAD7CF;  /* 상담 버튼 테두리 */
    --img: #F1EFEA;       /* 사진 자리 */
    --sale: #6B7A2A;      /* 할인율 */
    --olive: #D1D798;     /* 시그니처: 구매하기 · 쇼핑몰 */
    --olive-ink: #2E3517;
    --kakao: #FAE100;
    --kakao-ink: #3C1E1E;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615;
      --ink: #EEEAE0;
      --sub: #D3CFC5;
      --muted: #A3A39D;
      --faint: #77756F;
      --line: #2C2C2A;
      --box: #3A3A37;
      --btn-line: #3F3F3C;
      --img: #2A2A28;
      --sale: #C3CA85;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 13px;
    line-height: 1.35;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .wrap {
    max-width: 460px;
    margin: 0 auto;
    padding: 30px 18px 36px;
  }

  /* ── 헤더 ─────────────────────────────────── */
  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  header p {
    margin: 5px 0 18px;
    font-size: 12px;
    font-weight: 300;
    color: var(--muted);
  }

  /* ── 지금 구매할 수 있어요 (박스) ───────────── */
  .now {
    border: 1px solid var(--box);
    border-radius: 8px;
    padding: 13px 13px 14px;
  }
  .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 14px;
    font-weight: 500;
  }
  .head small { font-size: 11.5px; font-weight: 300; color: var(--muted); }
  .item { padding-top: 11px; }
  .item + .item { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
  .pd { display: grid; grid-template-columns: 80px 1fr; gap: 12px; }
  .pd.noimg { grid-template-columns: 1fr; }
  .pd img, .pd .ph {
    width: 80px;
    height: 80px;
    border-radius: 4px;
    object-fit: cover;
    background: var(--img);
    display: block;
  }
  .nm { margin: 1px 0 4px; font-size: 13.5px; font-weight: 400; }
  .pr { font-size: 14px; font-weight: 500; }
  .pr em { font-style: normal; color: var(--sale); margin-right: 4px; }
  .pr s { margin-left: 4px; font-size: 11.5px; font-weight: 300; color: var(--faint); }
  .dl { margin-top: 4px; font-size: 11.5px; font-weight: 300; color: var(--muted); }
  .dl b { font-weight: 400; color: var(--ink); }
  /* 구매하기: 페이지에서 가장 큰 버튼 */
  .buy {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 46px;
    margin-top: 12px;
    border-radius: 6px;
    background: var(--olive);
    color: var(--olive-ink);
    font-size: 14.5px;
    font-weight: 500;
  }
  .buy.off { background: var(--img); color: var(--muted); pointer-events: none; }
  .item.off img { opacity: .5; }
  .none { padding: 14px 0 4px; font-size: 12.5px; font-weight: 300; color: var(--muted); }

  /* ── 곧 오픈해요 (한 단계 작게) ─────────────── */
  .soon { margin-top: 26px; }
  .soon .head {
    font-size: 13px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--ink);
  }
  .soon .head small { font-size: 11px; }
  .row {
    display: grid;
    grid-template-columns: 46px 1fr auto;
    gap: 8px;
    align-items: baseline;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .row .dt { font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .row .dt small, .row .n small { display: block; font-size: 10.5px; font-weight: 300; color: var(--muted); margin-top: 1px; }
  .row .n { font-size: 12.5px; font-weight: 300; color: var(--sub); }
  .row .c { font-size: 11px; font-weight: 300; color: var(--muted); white-space: nowrap; text-align: right; }
  .row .c small { display: block; font-size: 10.5px; margin-top: 1px; }
  .row .c.today { color: var(--ink); font-weight: 400; }
  .row .c.today small { color: var(--muted); font-weight: 300; }

  /* ── 배송 안내 (마감된 외부몰 공구의 배송 조회) ── */
  .ship { margin-top: 22px; display: grid; gap: 6px; }
  .ship a {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-radius: 6px;
    background: #1A1A1A;
    color: #F4F2EC;
  }
  .ship .lb { display: block; font-size: 11px; font-weight: 300; color: var(--olive); }
  .ship .tt { display: block; margin-top: 3px; font-size: 14px; font-weight: 500; }
  .ship .ds { display: block; margin-top: 3px; font-size: 11px; font-weight: 300; color: #A9A69E; }
  .ship .go { font-size: 12.5px; font-weight: 400; color: var(--olive); white-space: nowrap; }
  .ship[hidden] { display: none; }
  .ship:not([hidden]) + .consult { margin-top: 10px; }

  /* ── 아래 버튼 ────────────────────────────── */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 40px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 400;
  }
  .btn svg { width: 17px; height: 17px; flex-shrink: 0; }
  .consult { margin-top: 22px; border: 1px solid var(--btn-line); }
  .consult svg { width: 23px; height: 23px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  .kakao { background: var(--kakao); color: var(--kakao-ink); }
  .kakao svg { width: 21px; height: 21px; }
  .shop { background: var(--olive); color: var(--olive-ink); }
  .biz {
    display: block;
    margin-top: 18px;
    text-align: center;
    font-size: 11px;
    font-weight: 300;
    color: var(--muted);
  }
  .pending { opacity: 0.5; pointer-events: none; }
  a:focus-visible { outline: 2px solid var(--olive-ink); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="handle"></h1>
    <p>두 아이를 키우는 40대 엄마의 이유있는 선택</p>
  </header>

  <section class="now" aria-label="지금 구매할 수 있는 공구">
    <div class="head">지금 구매할 수 있어요<small id="nowCount"></small></div>
    <div id="nowList"><p class="none">불러오는 중…</p></div>
  </section>

  <section class="soon" id="soonSec" aria-label="오픈 예정 공구" hidden>
    <div class="head">곧 오픈해요</div>
    <div id="soonList"></div>
  </section>

  <section class="ship" id="shipSec" aria-label="배송 안내" hidden></section>

  <a class="btn consult" id="chatBtn" href="#">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 4C7.2 4 3.4 6.9 3.4 10.5c0 2.3 1.5 4.3 3.9 5.5-.2.8-.6 2.2-1.4 3.1-.1.2 0 .4.2.4 1.9-.3 3.6-1.3 4.5-1.9.5.1.9.1 1.4.1 4.8 0 8.6-2.9 8.6-6.6S16.8 4 12 4z"></path>
      <circle cx="8.4" cy="10.6" r="1" fill="var(--bg)"></circle>
      <circle cx="12" cy="10.6" r="1" fill="var(--bg)"></circle>
      <circle cx="15.6" cy="10.6" r="1" fill="var(--bg)"></circle>
    </svg>
    타코베베 상담 · 문의하기</a>
  <div class="pair">
    <a class="btn kakao" id="alertBtn" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="var(--kakao-ink)" d="M12 4C7.2 4 3.4 6.9 3.4 10.5c0 2.3 1.5 4.3 3.9 5.5-.2.8-.6 2.2-1.4 3.1-.1.2 0 .4.2.4 1.9-.3 3.6-1.3 4.5-1.9.5.1.9.1 1.4.1 4.8 0 8.6-2.9 8.6-6.6S16.8 4 12 4z"></path>
        <text x="12" y="12.35" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="5.2" font-weight="900" fill="var(--kakao)">TALK</text>
      </svg>
      카톡 오픈 알림</a>
    <a class="btn shop" id="shopBtn" href="https://m.takkobebe.com/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5 5.3 5h13.4L20 9.5"></path>
        <path d="M4 9.5c0 1.4 1.1 2.5 2.7 2.5s2.6-1.1 2.6-2.5c0 1.4 1.1 2.5 2.7 2.5s2.7-1.1 2.7-2.5c0 1.4 1 2.5 2.6 2.5S20 10.9 20 9.5"></path>
        <path d="M5.5 12v7h13v-7"></path>
        <path d="M10 19v-4h4v4"></path>
      </svg>
      타코베베 쇼핑몰</a>
  </div>
  <a class="biz" id="contactBtn" href="#">비즈니스 제안 · takkobebe@naver.com</a>
</div>

<script>
  // ── 설정 (여기만 수정하면 됩니다) ──────────────────────────
  const HANDLE = "takkobebe";           // 인스타그램 계정명
  const LINKS = {
    contact: "mailto:takkobebe@naver.com", // 비즈니스 제안 메일
    kakaoAlert: "https://pf.kakao.com/_mDJxaC/chat", // 공구 알림 카카오톡 채널 링크
    consult: "https://m.takkobebe.com/shop/product_qna_list.php", // 상담·문의
  };
  const SHOP_URL = "https://m.takkobebe.com"; // 상품 링크가 없을 때 이동할 곳 · 쇼핑몰 버튼
  const OPEN_HOUR = 10; // 공구 판매 시작 시각 (오전 10시) — 이 시각부터 '지금 구매'로 올라감
  // 품절: 상품명에 이 글자가 들어 있으면 버튼이 회색 '품절'로 바뀌고 목록 맨 아래로 내려감. 다시 팔면 지우기.
  const SOLD_OUT = [];
  // 배송 안내: 외부몰에서 판매한 공구의 배송 조회 카드. showUntil 날짜가 지나면 자동으로 사라짐.
  // 새로 추가할 땐 아래 한 줄을 복사해서 고치면 됩니다. 비워 두면([]) 카드가 안 보여요.
  const SHIP_NOTICES = [
    {
      title: "설성목장 부리또 2종",
      desc: "10/1(목) 마감 · 설성목장몰에서 배송 조회",
      url: "https://mall.sulsung.com/order/lookup", // 설성목장몰 비회원 주문조회 (주문번호 + 주문 시 연락처)
      showUntil: "2026-10-31",
    },
  ];
  // ──────────────────────────────────────────────────────────

  document.getElementById("handle").textContent = HANDLE;

  const DAY_MS = 86400000;
  const DOW = ["일", "월", "화", "수", "목", "금", "토"];
  const toDate = (s) => {
    const [d, t] = s.split(" ");
    const [y, m, dd] = d.split("-").map(Number);
    const [h, mi] = (t || "0:0").split(":").map(Number);
    return new Date(y, m - 1, dd, h, mi);
  };
  const midnight = (dt) => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
  const now = new Date();
  const today = midnight(now);
  const daysUntil = (s) => Math.round((midnight(toDate(s)) - today) / DAY_MS);
  const md = (s, sep) => { const d = toDate(s); return (d.getMonth() + 1) + sep + d.getDate(); };
  const dow = (s) => DOW[toDate(s).getDay()];

  // 시간 없는 종료일은 그날 자정까지, 시간 없는 시작일은 오전 10시부터
  const endOf = (ev) =>
    ev.end.includes(":") ? toDate(ev.end) : new Date(toDate(ev.end).getTime() + DAY_MS - 1);
  const startOf = (ev) =>
    ev.start.includes(":") ? toDate(ev.start) : new Date(toDate(ev.start).getTime() + OPEN_HOUR * 3600000);

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const num = (s) => Number(String(s || "").replace(/[^0-9]/g, "")) || 0;

  const isSoldOut = (ev) => SOLD_OUT.some((w) => w && String(ev.title).includes(w));

  // 지금 구매할 수 있는 상품 한 칸: 사진 · 이름 · 가격 · 마감 · 구매하기
  function liveItem(ev) {
    const item = el("div", "item");
    const pd = el("div", "pd" + (ev.img ? "" : " noimg"));
    if (ev.img) {
      const img = el("img");
      img.src = ev.img;
      img.alt = "";
      img.onerror = () => { pd.classList.add("noimg"); img.remove(); };
      pd.appendChild(img);
    }
    const info = el("div");
    info.appendChild(el("p", "nm", ev.title));
    const sell = num(ev.sell), cons = num(ev.cons);
    if (sell) {
      const pr = el("p", "pr");
      pr.style.margin = "0";
      if (cons > sell) pr.appendChild(el("em", null, Math.round((1 - sell / cons) * 100) + "%"));
      pr.appendChild(document.createTextNode(sell.toLocaleString("ko-KR") + "원"));
      if (cons > sell) pr.appendChild(el("s", null, cons.toLocaleString("ko-KR") + "원"));
      info.appendChild(pr);
    }
    const dl = el("p", "dl");
    const left = daysUntil(ev.end);
    dl.appendChild(el("b", null, left <= 0 ? "오늘 마감" : left + "일 남음"));
    let meta = " · " + md(ev.end, "/") + "(" + dow(ev.end) + ") 마감";
    const free = String(ev.ship || "").match(/(\d+만\s?원\s?이상\s?)?무료\s?배송/);
    if (free) meta += " · " + free[0].replace(/\s+/g, " ");
    dl.appendChild(document.createTextNode(meta));
    dl.style.margin = "4px 0 0";
    info.appendChild(dl);
    pd.appendChild(info);
    item.appendChild(pd);

    if (isSoldOut(ev)) {
      item.classList.add("off");
      dl.firstChild.textContent = "품절";
      item.appendChild(el("span", "buy off", "품절"));
      return item;
    }
    const buy = el("a", "buy", "구매하기");
    buy.href = ev.url || SHOP_URL;
    buy.target = "_blank";
    buy.rel = "noopener";
    item.appendChild(buy);
    return item;
  }

  // 곧 오픈해요 한 줄: 날짜 · 상품명(마감일) · 며칠 뒤
  function soonRow(ev) {
    const row = el("div", "row");
    const dt = el("div", "dt", md(ev.start, "."));
    dt.appendChild(el("small", null, dow(ev.start)));
    const n = el("div", "n", ev.title);
    n.appendChild(el("small", null, md(ev.end, ".") + "(" + dow(ev.end) + ")까지"));
    const d = daysUntil(ev.start);
    const s = startOf(ev);
    const h = s.getHours(), mi = s.getMinutes();
    const openAt = (h < 12 ? "오전 " : "오후 ") + (h > 12 ? h - 12 : h) + "시" + (mi ? " " + mi + "분" : "");
    const when = d <= 0 ? "오늘" : d === 1 ? "내일" : d === 2 ? "이틀 뒤" : d + "일 뒤";
    const c = el("div", "c" + (d <= 0 ? " today" : ""), when);
    c.appendChild(el("small", null, openAt + " 오픈"));
    row.append(dt, n, c);
    return row;
  }

  function render(events) {
    const valid = events
      .filter((ev) => ev && ev.title && ev.start && ev.end && now <= endOf(ev))
      .sort((a, b) => toDate(a.start) - toDate(b.start)); // 같은 날은 API 순서(캘린더 번호 순) 유지
    // 시작일 당일에는 10시 전이라도 상품이 이미 살 수 있으면(사장님이 미리 열면) '지금 구매'로 올린다.
    // 오늘 시작하는 일정에만 적용 — 상시 판매 상품에 뒷날짜 일정을 걸어도 미리 뜨지 않게 (2026-09-23)
    const isLive = (ev) => now >= startOf(ev) || (daysUntil(ev.start) <= 0 && ev.onSale === true);
    const live = valid.filter(isLive).sort((a, b) => isSoldOut(a) - isSoldOut(b)); // 품절은 맨 아래로
    const soon = valid.filter((ev) => !isLive(ev));
    const buyable = live.filter((ev) => !isSoldOut(ev)).length;

    const nowList = document.getElementById("nowList");
    nowList.innerHTML = "";
    document.getElementById("nowCount").textContent = buyable ? buyable + "개" : "";
    if (live.length) live.forEach((ev) => nowList.appendChild(liveItem(ev)));
    else nowList.appendChild(el("p", "none",
      soon.length ? "지금 진행 중인 공구가 없어요. 아래 오픈 일정을 확인해 주세요." : "지금 진행 중인 공구가 없어요."));

    const soonList = document.getElementById("soonList");
    soonList.innerHTML = "";
    soon.forEach((ev) => soonList.appendChild(soonRow(ev)));
    document.getElementById("soonSec").hidden = !soon.length;
  }

  // 카카오워크 캘린더에서 일정을 불러옴
  fetch("/api/schedule")
    .then((r) => { if (!r.ok) throw 0; return r.json(); })
    .then((data) => {
      render(Array.isArray(data.events) ? data.events : []);
      renderClosed(Array.isArray(data.closed) ? data.closed : []);
    })
    .catch(() => {
      const box = document.getElementById("nowList");
      box.innerHTML = "";
      box.appendChild(el("p", "none", "일정을 불러오지 못했어요. 잠시 후 다시 열어 주세요."));
    });

  // 마감된 공구 → 본사 고객센터 카드 (2026-10-08)
  // 캘린더 설명란에 "고객센터: https://..." 를 적은 공구만, 마감 다음 날부터 2주 동안 보인다 (기간 계산은 /api/schedule).
  function renderClosed(list) {
    const sec = document.getElementById("shipSec");
    list
      .filter((c) => c && c.title && /^https?:\/\//.test(c.cs || ""))
      .forEach((c) => {
        const a = el("a");
        a.href = c.cs;
        a.target = "_blank";
        a.rel = "noopener";
        const t = el("span");
        t.append(el("span", "lb", "마감된 공구"), el("span", "tt", c.title));
        t.appendChild(el("span", "ds", md(c.end, ".") + "(" + dow(c.end) + ") 마감 · 배송·교환·반품 문의"));
        a.append(t, el("span", "go", "고객센터 ›"));
        sec.appendChild(a);
      });
    sec.hidden = !sec.children.length;
  }

  // 배송 안내 카드
  (function () {
    const sec = document.getElementById("shipSec");
    SHIP_NOTICES
      .filter((s) => s && s.title && s.url && (!s.showUntil || now <= endOf({ end: s.showUntil })))
      .forEach((s) => {
        const a = el("a");
        a.href = s.url;
        a.target = "_blank";
        a.rel = "noopener";
        const t = el("span");
        t.append(el("span", "lb", "배송 안내"), el("span", "tt", s.title));
        if (s.desc) t.appendChild(el("span", "ds", s.desc));
        a.append(t, el("span", "go", "배송 조회 ›"));
        sec.appendChild(a);
      });
    sec.hidden = !sec.children.length;
  })();

  // 링크 연결: 값이 비어 있으면 흐리게 표시
  function wire(id, url) {
    const a = document.getElementById(id);
    if (url) a.href = url;
    else { a.classList.add("pending"); a.removeAttribute("href"); }
  }
  wire("shopBtn", SHOP_URL + "/");
  wire("contactBtn", LINKS.contact);
  wire("alertBtn", LINKS.kakaoAlert);
  wire("chatBtn", LINKS.consult);
</script>
</body>
